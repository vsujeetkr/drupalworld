name: Drupal CD

# Runs only after the "Drupal CI" workflow finishes, and only proceeds
# if that run succeeded AND it ran on main. This is what makes deploy
# conditional on a green CI pipeline, even though it's a separate file.
on:
  workflow_run:
    workflows: ["Drupal CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to droplet using SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        debug: true
        script: |
          cd ${{ secrets.DOCROOT }}
          git pull
          robo job:drupal-update
