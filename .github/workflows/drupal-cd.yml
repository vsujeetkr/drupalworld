name: Drupal CD

# Triggers only after "Drupal CI" (ci.yml) finishes, and only proceeds
# if that run succeeded. workflow_run itself doesn't support a top-level
# branch filter combined with workflow name the same way push does in
# all GitHub versions, so we also double-check the branch explicitly
# in the job's `if` below, to be safe.
on:
  workflow_run:
    workflows: ["Drupal CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    environment: production
    steps:
      - name: Deploy via SSH (git pull + Robo task)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          use_insecure_cipher: true # BigRock's sshd only offers diffie-hellman-group-exchange-sha256,
                                     # which Go's ssh library only supports under this flag (golang/go#20201)
          script_stop: true
          debug: true
          command_timeout: 20m
          script: |
            cd ${{ secrets.DOCROOT }}

            # 1. Mute Symfony deprecation warnings from stopping the build
            export SYMFONY_DEPRECATIONS_HELPER=disabled

            # 2. Start an SSH Agent session and load your unique deploy key
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/github_deploy_key

            # 3. Inject local project binaries (Drush) and system Composer into the executable PATH
            export PATH=$PWD/vendor/bin:/opt/cpanel/composer/bin:$PATH

            # 4. Pull the latest code safely with the active SSH Agent context
            git pull origin main

            # 5. Trigger the Drupal deployment update tasks via Robo
            vendor/bin/robo job:drupal-update
